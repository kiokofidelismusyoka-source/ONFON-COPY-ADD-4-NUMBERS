<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean & Add 4 to Numbers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Clean & Add 4 to Numbers</h2>
  <textarea id="input" placeholder="Paste numbers here..."></textarea>
  <br>
  <button onclick="cleanAndFormat()">Clean & Format</button>
  <button id="copyBtn" onclick="copyAll()">Copy All</button>

  <div id="result" class="output"></div>

  <script src="script.js"></script>
</body>
</html>
